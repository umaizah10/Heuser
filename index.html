<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Pet - Kitty</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Ambient Animated Background Particles -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div id="game-container">
    <!-- Header with title and sound toggle -->
    <header id="header-area">
      <div class="header-brand">
        <span class="brand-icon">✨</span>
        <h1 id="game-title">Virtual Pet</h1>
      </div>
      <button id="btn-sound" class="btn-sound" type="button" aria-label="Toggle Sound" title="Toggle Sound">🔊 Sound: ON</button>
    </header>

    <!-- Pet display area -->
    <div id="pet-area">
      <div id="pet-card">
        <div id="pet-name-badge">
          <span class="badge-dot"></span>
          <h2 id="pet-name">KITTY</h2>
        </div>

        <!-- Floating action particles container -->
        <div id="particle-container" aria-hidden="true"></div>

        <!-- Pet character SVG -->
        <svg id="pet-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Kitty the virtual pet">
          <defs>
            <!-- Radial Glow Gradient for Kitty's Body -->
            <radialGradient id="petGradient" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#FF72BE" />
              <stop offset="60%" stop-color="#FF3399" />
              <stop offset="100%" stop-color="#C71585" />
            </radialGradient>
            
            <radialGradient id="cheekGradient" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FF1493" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#FF69B4" stop-opacity="0" />
            </radialGradient>

            <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="6" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Ears -->
          <ellipse cx="55" cy="68" rx="19" ry="24" class="pet-body-part"/>
          <ellipse cx="145" cy="68" rx="19" ry="24" class="pet-body-part"/>

          <!-- Body -->
          <ellipse cx="100" cy="120" rx="72" ry="62" class="pet-body-part"/>

          <!-- Soft Blush Cheeks -->
          <circle cx="56" cy="128" r="12" fill="url(#cheekGradient)" class="pet-cheek"/>
          <circle cx="144" cy="128" r="12" fill="url(#cheekGradient)" class="pet-cheek"/>

          <!-- Eyes (Normal) -->
          <g id="pet-left-eye">
            <ellipse cx="76" cy="108" rx="14" ry="17" fill="#FFFFFF"/>
            <circle id="pet-left-pupil" cx="76" cy="110" r="7.5" fill="#120A2A"/>
            <circle cx="72" cy="104" r="3" fill="#FFFFFF"/> <!-- Eye Catchlight -->
          </g>
          <g id="pet-right-eye">
            <ellipse cx="124" cy="108" rx="14" ry="17" fill="#FFFFFF"/>
            <circle id="pet-right-pupil" cx="124" cy="110" r="7.5" fill="#120A2A"/>
            <circle cx="120" cy="104" r="3" fill="#FFFFFF"/> <!-- Eye Catchlight -->
          </g>

          <!-- Sleeping eyes (closed arcs) -->
          <g id="pet-sleeping-eyes" style="display: none;">
            <path id="pet-left-sleep-eye" d="M 64 110 Q 76 96 88 110" stroke="#120A2A" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path id="pet-right-sleep-eye" d="M 112 110 Q 124 96 136 110" stroke="#120A2A" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>

          <!-- X eyes (game over) -->
          <g id="pet-left-x" style="display: none;">
            <line x1="66" y1="98" x2="86" y2="118" stroke="#120A2A" stroke-width="4" stroke-linecap="round"/>
            <line x1="86" y1="98" x2="66" y2="118" stroke="#120A2A" stroke-width="4" stroke-linecap="round"/>
          </g>
          <g id="pet-right-x" style="display: none;">
            <line x1="114" y1="98" x2="134" y2="118" stroke="#120A2A" stroke-width="4" stroke-linecap="round"/>
            <line x1="134" y1="98" x2="114" y2="118" stroke="#120A2A" stroke-width="4" stroke-linecap="round"/>
          </g>

          <!-- Mouth -->
          <path id="pet-mouth" d="M 85 135 Q 100 150 115 135" fill="none" stroke="#120A2A" stroke-width="3" stroke-linecap="round"/>
        </svg>

        <p id="mood-text">🙂 Your pet is doing okay.</p>
        <p id="status-text"></p>
      </div>
    </div>

    <!-- Stats display area -->
    <div id="stats-area">
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">🍗 HUNGER</span>
          <span id="hunger-value" class="stat-value">50 / 100</span>
        </div>
        <div class="stat-bar-bg">
          <div id="hunger-bar" class="stat-bar-fill hunger-fill"></div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">😊 HAPPINESS</span>
          <span id="happiness-value" class="stat-value">50 / 100</span>
        </div>
        <div class="stat-bar-bg">
          <div id="happiness-bar" class="stat-bar-fill happiness-fill"></div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">⚡ ENERGY</span>
          <span id="energy-value" class="stat-value">50 / 100</span>
        </div>
        <div class="stat-bar-bg">
          <div id="energy-bar" class="stat-bar-fill energy-fill"></div>
        </div>
      </div>
    </div>

    <!-- Action buttons area -->
    <div id="actions-area">
      <button id="btn-feed" disabled>
        <span class="btn-icon">🍗</span>
        <span class="btn-label">Feed</span>
      </button>
      <button id="btn-play" disabled>
        <span class="btn-icon">🎾</span>
        <span class="btn-label">Play</span>
      </button>
      <button id="btn-sleep" disabled>
        <span class="btn-icon">💤</span>
        <span class="btn-label">Sleep</span>
      </button>
    </div>

    <!-- Game control area -->
    <div id="info-area">
      <span id="timer" class="hidden" aria-hidden="true">00:00</span>
      <button id="btn-start">
        <span class="btn-glow"></span>
        🚀 Start Game
      </button>
      <button id="btn-restart" class="hidden">
        🔄 Restart
      </button>
      <button id="btn-reset-data" class="btn-secondary" title="Reset all saved progress">🧹 Reset Data</button>
    </div>

    <!-- Game Over overlay -->
    <div id="game-over-overlay" class="hidden">
      <div class="overlay-card">
        <div id="game-over-icon">💀</div>
        <h3 class="overlay-title">GAME OVER</h3>
        <p id="game-over-message"></p>
      </div>
    </div>
  </div>
</body>
</html>
